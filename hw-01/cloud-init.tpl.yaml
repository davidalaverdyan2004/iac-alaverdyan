#cloud-config
# шаблон настройки машины; ${...} подставляет create.sh через envsubst

users:
  - name: student                          # логин для входа по SSH
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${SSH_KEY}

package_update: true

packages:
  - nginx

runcmd:
  # порт nginx: IPv4 и IPv6
  - sed -i 's/listen 80 default_server;/listen ${APP_PORT} default_server;/' /etc/nginx/sites-available/default
  - sed -i 's/listen \[::\]:80 default_server;/listen [::]:${APP_PORT} default_server;/' /etc/nginx/sites-available/default
  # страница: слово варианта и имя машины
  - bash -c 'echo "${GREETING} on $(hostname)" > /var/www/html/index.nginx-debian.html'
  - nginx -t
  - systemctl restart nginx
